{% extends 'devBlog/base.html' %}

{% block title %}Sửa bài viết - Perspect{% endblock %}

{% block content %}
<div class="card">
  <h1 class="mb-3"><i class="fa-solid fa-pen"></i> Sửa bài viết</h1>
  <form method="POST" enctype="multipart/form-data" class="form-group">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_title">Tiêu đề:</label>
      <input type="text" name="title" id="id_title" value="{{ form.title.value|default:'' }}" required />
    </div>
    <div class="form-group">
      <label for="id_content">Nội dung:</label>
      <textarea name="content" id="id_content" rows="6">{{ form.content.value|default:'' }}</textarea>
    </div>
    <div class="form-group">
      <label for="id_image">Hình ảnh:</label>
      {% if post.image %}
        <p style="margin-bottom:.5rem;"><img src="{{ post.image.url }}" alt="" style="max-width:200px;border-radius:.5rem;" /></p>
      {% endif %}
      <input type="file" name="image" id="id_image" accept="image/*" />
    </div>
    <div class="form-group">
      <label>Thẻ bài viết:</label>
      <div class="tag-checkbox-grid">
        {% for tag in form.tags.field.queryset %}
          <label>
            <input type="checkbox" name="tags" value="{{ tag.id }}"
              {% for selected in form.tags.value %}
                {% if selected|stringformat:"s" == tag.id|stringformat:"s" %}checked{% endif %}
              {% endfor %}
            />
            {{ tag.name }}
          </label>
        {% endfor %}
      </div>
    </div>
    <button type="submit" class="btn"><i class="fa-solid fa-save"></i> Lưu thay đổi</button>
  </form>
</div>
{% endblock %}
